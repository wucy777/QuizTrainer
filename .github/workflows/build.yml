name: Build

# 公开仓库的 Actions 额度不受限，这里只跑必要的构建与发布。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.29.0'

jobs:
  # ── Windows 单文件 exe ──
  windows:
    name: Windows 单文件 exe
    # 用 windows-2022（VS 2022 = v17）。windows-latest 已升级到 VS 2026（v18），
    # 而 Flutter 3.29 的生成器映射只认 v17，其它一律退回 "Visual Studio 16 2019"，
    # 导致 CMake 报 "could not find any instance of Visual Studio"。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: flutter_app
        run: flutter pub get

      - name: 静态检查
        working-directory: flutter_app
        run: flutter analyze

      - name: 跑测试
        working-directory: flutter_app
        run: flutter test

      - name: 构建 Windows
        working-directory: flutter_app
        run: flutter build windows --release

      - name: 打成单文件 exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_single_exe.ps1

      - name: 整理产物
        # 用 pwsh（默认 UTF-8）+ 通配符：Windows PowerShell 5.1 会把内联脚本里的
        # 中文按本地代码页解析，直接写中文文件名会找不到文件。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item 'output/*.exe' 'dist/QuizTrainer-windows-x64.exe'
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/QuizTrainer-windows-x64.exe
          if-no-files-found: error

  # ── Android APK ──
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: flutter_app
        run: flutter pub get

      - name: 构建 APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: 整理产物
        run: |
          mkdir -p dist
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk dist/QuizTrainer-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/QuizTrainer-android.apk
          if-no-files-found: error

  # ── 发布 Release ──
  release:
    name: 发布 Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 读取版本号
        id: ver
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          echo "标签：$TAG"
          ls -la dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，更新标题/说明并覆盖产物"
            gh release edit "$TAG" \
              --title "$TAG" \
              --prerelease=false \
              --notes-file Document/RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # 不加 --prerelease：预发布不参与 Latest，仓库侧栏会退回显示 tag 数量。
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file Document/RELEASE_NOTES.md
          fi
